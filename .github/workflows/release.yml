name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Tag '$version' does not look like <major>.<minor>.<patch>."
          }
          "PLUGIN_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        shell: pwsh
        run: dotnet build src/DeckSurf.Plugin.OBS.slnx --configuration Release -p:Version=$env:PLUGIN_VERSION

      - name: Package
        shell: pwsh
        run: |
          $staging = "artifacts/DeckSurf.Plugin.OBS"
          New-Item -ItemType Directory -Force $staging | Out-Null
          # Only the plugin assembly ships; the DeckSurf host provides the SDK.
          Copy-Item "src/DeckSurf.Plugin.OBS/bin/Release/DeckSurf.Plugin.OBS.dll" $staging
          Copy-Item "README.md" $staging
          Compress-Archive -Path $staging -DestinationPath "artifacts/DeckSurf.Plugin.OBS-${{ github.ref_name }}.zip"

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "artifacts/DeckSurf.Plugin.OBS-${{ github.ref_name }}.zip" `
            --title "DeckSurf OBS Connector $env:PLUGIN_VERSION" `
            --generate-notes
